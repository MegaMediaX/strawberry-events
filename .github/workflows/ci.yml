name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual deploys from the Actions tab — still CI-gated (deploy needs verify).
  workflow_dispatch:

# A new push to a PR supersedes the previous run. Runs on main QUEUE instead of
# cancelling — cancelling could kill an in-flight VPS deploy mid-restart.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      # Node 20 to match the runtime image (apps/web/Dockerfile: node:20-slim).
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # Prisma client types are required before typecheck/build.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Suites needing a real database or a live pretix instance self-skip when
      # TEST_DATABASE_URL / PRETIX_* are unset, so this stays hermetic.
      - name: Test
        run: npm test

      # Every route is dynamic, so nothing reaches the database at build time;
      # DATABASE_URL only has to parse.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

  # ---------------------------------------------------------------------------
  # CD step 1 — build the image CI just verified and push it to GHCR.
  #
  # The image, not the source, is the deployment artifact. The server therefore
  # needs no checkout of this repo (it isn't one), receives no repo files, and
  # spends none of its constrained disk/CPU on a Next.js build.
  # ---------------------------------------------------------------------------
  image:
    name: build & push image
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Build and push
        id: build
        env:
          REGISTRY: ghcr.io
        run: |
          # GHCR requires an all-lowercase path; the owner here is mixed-case.
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="$REGISTRY/$REPO:${{ github.sha }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" -t "$REGISTRY/$REPO:latest" apps/web
          docker push "$IMAGE"
          docker push "$REGISTRY/$REPO:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed $IMAGE"

  # ---------------------------------------------------------------------------
  # CD step 2 — roll that image out on the VPS.
  #
  # Runs only on main (never on PRs) and only after CI + image build succeed.
  # While the VPS_* secrets are unset the job skips with a notice. See README
  # "CD — auto-deploy to the VPS" for the one-time setup.
  #
  # It targets the deployment AS IT EXISTS ON THE SERVER, which does not match
  # this repo's compose.yaml: the live project has its own compose filename and
  # service names, and pretix runs as a SEPARATE compose project. Hence:
  #   * the compose file is passed with -f — Docker Compose would otherwise
  #     PREFER a compose.yaml in the same directory (this repo ships one) and
  #     recreate the project as a different stack;
  #   * only the web service is recreated (`--no-deps`); `--remove-orphans` is
  #     never used, as it would delete containers of the real deployment;
  #   * the pulled image is re-tagged to whatever name the compose file already
  #     expects, so the server's compose file needs no edit;
  #   * a preflight aborts before any change, and the previous image is restored
  #     if migrations or the health check fail.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy to VPS
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    # Never run two deploys at once; a second one queues.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy configuration
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          # VPS_APP_DIR is required, not defaulted: a wrong-but-plausible default
          # points the deploy at the wrong directory on the server.
          missing=
          [ -z "$VPS_HOST" ] && missing="$missing VPS_HOST"
          [ -z "$VPS_USER" ] && missing="$missing VPS_USER"
          [ -z "$VPS_SSH_KEY" ] && missing="$missing VPS_SSH_KEY"
          [ -z "$VPS_APP_DIR" ] && missing="$missing VPS_APP_DIR"
          if [ -n "$missing" ]; then
            echo "::notice::VPS deploy secrets not configured ($missing ) — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Log the server in to GHCR
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Sent on stdin, so the token never appears in the server's process
          # list. It is the run-scoped GITHUB_TOKEN, and the deploy logs out
          # again as soon as the pull is done — no long-lived credential is
          # left on the server.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and health-check
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_COMPOSE_FILE: ${{ secrets.VPS_COMPOSE_FILE }}
          VPS_WEB_SERVICE: ${{ secrets.VPS_WEB_SERVICE }}
          VPS_HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          NEW_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # The script is COPIED to the server and run from a file, never piped
          # into `bash -s`. Piping puts it on stdin, where any command that reads
          # stdin — `docker compose exec -T` did exactly this — swallows the rest
          # of the script; bash then hits EOF and exits 0, so every remaining
          # step (including the health check) is silently skipped and the deploy
          # reports success. `ssh -n` keeps stdin closed for the run itself.
          RS="/tmp/strawberry-deploy-$GITHUB_RUN_ID.sh"
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} $VPS_USER@$VPS_HOST"
          $SSH "cat > $RS" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${1:?app dir}"
          NEW_IMAGE="${2:?image}"
          COMPOSE_FILE="${3:?compose file}"
          WEB_SERVICE="${4:?web service}"
          HEALTH_URL="${5-}"

          cd "$APP_DIR"
          # -f is not optional: without it Docker Compose prefers a compose.yaml
          # in the same directory (this repo ships one) over the deployment's
          # own file, which would recreate the project as a different stack.
          DC="docker compose -f $COMPOSE_FILE"

          echo "==> Preflight in $APP_DIR"
          [ -f "$COMPOSE_FILE" ] || { echo "!! $APP_DIR/$COMPOSE_FILE does not exist — set VPS_COMPOSE_FILE"; exit 1; }
          $DC config --services | grep -qx "$WEB_SERVICE" || {
            echo "!! service '$WEB_SERVICE' is not in $COMPOSE_FILE — set VPS_WEB_SERVICE. Services present:"
            $DC config --services
            exit 1
          }

          CID=$($DC ps -q "$WEB_SERVICE" 2>/dev/null | head -1 || true)
          [ -n "$CID" ] || { echo "!! $WEB_SERVICE has no running container — start it once before deploying"; exit 1; }

          # Refuse to replace a container that is not this app: a wrong
          # VPS_WEB_SERVICE would otherwise take an unrelated service down.
          docker exec "$CID" test -f /app/server.js 2>/dev/null || {
            echo "!! '$WEB_SERVICE' does not look like this Next.js app (/app/server.js missing) — refusing to replace it"
            exit 1
          }

          # The image name to re-tag, taken from the container just verified to
          # BE this app. Do not use `compose config --images`: it returns the
          # images of the whole project, and taking the first line once re-tagged
          # the DATABASE's image name (postgres:16-alpine) to the app image.
          TARGET_IMG=$(docker inspect --format '{{.Config.Image}}' "$CID")
          [ -n "$TARGET_IMG" ] || { echo "!! could not determine the image name for $WEB_SERVICE"; exit 1; }
          case "$TARGET_IMG" in
            postgres:*|redis:*|nginx:*|traefik:*|*/postgres:*|*/redis:*)
              echo "!! '$WEB_SERVICE' runs $TARGET_IMG — that is an infrastructure image, not this app."
              echo "   Give the web service its own image name in the compose file before deploying."
              exit 1
              ;;
          esac
          echo "==> Replacing $TARGET_IMG (container: $CID) with $NEW_IMAGE"

          # Image id currently behind that tag, for rollback.
          PREV_ID=$(docker image inspect --format '{{.Id}}' "$TARGET_IMG" 2>/dev/null || true)

          rollback() {
            if [ -z "$PREV_ID" ]; then echo "!! no previous image recorded — cannot roll back"; return; fi
            docker tag "$PREV_ID" "$TARGET_IMG"
            $DC up -d --no-deps --force-recreate "$WEB_SERVICE" >/dev/null 2>&1 \
              && echo "==> Rolled back to the previous image" \
              || echo "!! rollback failed — the service needs manual attention"
          }

          echo "==> Pulling the CI-built image"
          docker pull -q "$NEW_IMAGE"
          docker tag "$NEW_IMAGE" "$TARGET_IMG"
          docker logout ghcr.io >/dev/null 2>&1 || true

          echo "==> Recreating $WEB_SERVICE only (database and other services untouched)"
          $DC up -d --no-deps --force-recreate "$WEB_SERVICE"

          # Idempotent: applies only migrations the database has not seen.
          # The CLI is invoked through node, NOT npx: the runner image copies the
          # prisma package but not node_modules/.bin, so `npx prisma` finds no
          # executable and fails with "sh: 1: prisma: not found".
          echo "==> Applying database migrations"
          if ! $DC exec -T "$WEB_SERVICE" node node_modules/prisma/build/index.js migrate deploy; then
            echo "!! migrations failed — rolling back"
            rollback
            exit 1
          fi

          # Health URL: explicit secret wins; otherwise use the service's own
          # published host port. Never skip the check silently.
          if [ -z "$HEALTH_URL" ]; then
            # `|| true`: with pipefail a service that publishes no port would
            # otherwise abort the script here instead of reaching the message below.
            PORT=$($DC port "$WEB_SERVICE" 3000 2>/dev/null | sed 's/.*://' || true)
            [ -n "${PORT:-}" ] && HEALTH_URL="http://localhost:$PORT/api/health/ready"
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "!! No health URL: $WEB_SERVICE publishes no host port and VPS_HEALTH_URL is unset."
            echo "   Set VPS_HEALTH_URL (e.g. https://your-domain/api/health/ready) so deploys are verified."
            rollback
            exit 1
          fi

          echo "==> Health check: $HEALTH_URL"
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "==> Healthy (HTTP 200 after ${i} checks)"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done

          echo "!! Health check failed (last HTTP $code) — state, logs, then rollback:"
          $DC ps
          $DC logs --tail=60 "$WEB_SERVICE" || true
          rollback
          exit 1
          REMOTE
          # Defaults match the live deployment; override per-server via secrets.
          $SSH -n "bash $RS '$VPS_APP_DIR' '$NEW_IMAGE' \
            '${VPS_COMPOSE_FILE:-docker-compose.yml}' \
            '${VPS_WEB_SERVICE:-strawberry-web}' \
            '${VPS_HEALTH_URL:-}'; rc=\$?; rm -f $RS; exit \$rc"
