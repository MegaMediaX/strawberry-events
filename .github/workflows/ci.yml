name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      # Node 20 to match the runtime image (apps/web/Dockerfile: node:20-slim).
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # Prisma client types are required before typecheck/build.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Suites needing a real database or a live pretix instance self-skip when
      # TEST_DATABASE_URL / PRETIX_* are unset, so this stays hermetic.
      - name: Test
        run: npm test

      # Every route is dynamic, so nothing reaches the database at build time;
      # DATABASE_URL only has to parse.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
